<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的作品集</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            /* 限制一下图片最大宽度，防止太大撑破屏幕 */
            max-width: 600px; 
        }
    </style>
</head>
<body>

    <h1>项目展示</h1>
    
    <div class="gallery">
        <!-- 这里循环列出1到12张图片 -->
        <!-- 请确保你的图片文件名确实是 1.jpg, 2.jpg ... 12.jpg -->
        
        <img src="1.jpg" alt="图片1">
        <img src="2.jpg" alt="图片2">
        <img src="3.jpg" alt="图片3">
        <img src="4.jpg" alt="图片4">
        <img src="5.jpg" alt="图片5">
        <img src="6.jpg" alt="图片6">
        <img src="7.jpg" alt="图片7">
        <img src="8.jpg" alt="图片8">
        <img src="9.jpg" alt="图片9">
        <img src="10.jpg" alt="图片10">
        <img src="11.jpg" alt="图片11">
        <img src="12.jpg" alt="图片12">
    </div>

</body>
</html>
