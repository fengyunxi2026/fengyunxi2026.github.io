<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>马楚轩 | 个人简历 - AI复合型人才</title>
    <!-- ==================== 样式库 CDN 引入 ==================== -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- ==================== Tailwind 配置 ==================== -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"Fira Code"', '"JetBrains Mono"', 'Consolas', 'Monaco', 'monospace'],
                        sans: ['"Inter"', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
                    },
                    animation: {
                        'blink': 'blink 1s step-end infinite',
                        'gradient': 'gradientShift 8s ease infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 3s ease-in-out infinite',
                    },
                    keyframes: {
                        blink: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0' }
                        },
                        gradientShift: {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-15px)' }
                        },
                    },
                },
            },
        };
    </script>
    <!-- ==================== 自定义样式 ==================== -->
    <style>
        :root {
            --bg-primary: #080818;
            --bg-secondary: #0d0d28;
            --bg-card: rgba(20, 20, 50, 0.55);
            --bg-card-hover: rgba(30, 30, 70, 0.75);
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0c0;
            --text-muted: #60608a;
            --accent-cyan: #00e5ff;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --border-color: rgba(255, 255, 255, 0.08);
            --glass-blur: 12px;
            --shadow-glow: 0 0 30px rgba(168, 85, 247, 0.15);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.35);
            --shadow-card-hover: 0 16px 48px rgba(0, 0, 0, 0.5);
            --gradient-bg: linear-gradient(135deg, #080818 0%, #12082a 25%, #0a1a3a 50%, #080818 75%, #10082a 100%);
            --gradient-hero: linear-gradient(135deg, #0a0a2e 0%, #1a0a3e 40%, #0d1b4e 70%, #0a0a2e 100%);
            --gradient-text: linear-gradient(135deg, #00e5ff 0%, #a855f7 50%, #ec4899 100%);
            --scrollbar-track: #0a0a1a;
            --scrollbar-thumb: #2a2a5a;
        }
        html:not(.dark) {
            --bg-primary: #f5f5fa;
            --bg-secondary: #eaeaf2;
            --bg-card: rgba(255, 255, 255, 0.7);
            --bg-card-hover: rgba(255, 255, 255, 0.9);
            --text-primary: #1a1a2e;
            --text-secondary: #3a3a5a;
            --text-muted: #8888aa;
            --accent-cyan: #0088cc;
            --accent-purple: #7c3aed;
            --accent-pink: #db2777;
            --border-color: rgba(0, 0, 0, 0.08);
            --glass-blur: 14px;
            --shadow-glow: 0 0 30px rgba(124, 58, 237, 0.1);
            --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.08);
            --shadow-card-hover: 0 16px 40px rgba(0, 0, 0, 0.14);
            --gradient-bg: linear-gradient(135deg, #f5f5fa 0%, #e8e8f5 25%, #e0e8f8 50%, #f5f5fa 75%, #eee8fa 100%);
            --gradient-hero: linear-gradient(135deg, #e8e8f5 0%, #ddd0f5 40%, #d0ddf5 70%, #e8e8f5 100%);
            --gradient-text: linear-gradient(135deg, #0088cc 0%, #7c3aed 50%, #db2777 100%);
            --scrollbar-track: #e8e8f0;
            --scrollbar-thumb: #b0b0cc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track); }
        body {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--gradient-bg);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.5s ease, color 0.5s ease;
            line-height: 1.6;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            box-shadow: var(--shadow-card);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .glass-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-6px);
            box-shadow: var(--shadow-card-hover), var(--shadow-glow);
            border-color: rgba(168, 85, 247, 0.3);
        }
        .gradient-text {
            background: var(--gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .tech-border { position: relative; }
        .tech-border::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 30px;
            height: 30px;
            border-top: 2px solid var(--accent-cyan);
            border-left: 2px solid var(--accent-cyan);
            border-radius: 0.5rem 0 0 0;
            opacity: 0.7;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .tech-border::after {
            content: '';
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 30px;
            height: 30px;
            border-bottom: 2px solid var(--accent-purple);
            border-right: 2px solid var(--accent-purple);
            border-radius: 0 0 0.5rem 0;
            opacity: 0.7;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .tech-border:hover::before { width: 60px; height: 60px; opacity: 1; }
        .tech-border:hover::after { width: 60px; height: 60px; opacity: 1; }
        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: var(--accent-cyan);
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .main-content { position: relative; z-index: 10; }
        .navbar {
            transition: all 0.4s ease;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid transparent;
        }
        .navbar.scrolled {
            border-bottom-color: var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            background: var(--bg-card);
        }
        #danmakuContainer { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: 100; pointer-events: none; overflow: hidden; }
        .danmaku-item {
            position: absolute;
            white-space: nowrap;
            pointer-events: none;
            animation: danmakuMove linear forwards;
            font-size: 1.1rem;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(168, 85, 247, 0.4);
            letter-spacing: 0.05em;
            will-change: transform;
        }
        @keyframes danmakuMove {
            0% { transform: translateX(100vw); opacity: 0; }
            5% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateX(-120%); opacity: 0; }
        }
        .hero-grid {
            background-image: linear-gradient(rgba(168, 85, 247, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(168, 85, 247, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.8) 0%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.8) 0%, transparent 70%);
        }
        .skill-tag {
            display: inline-flex;
            align-items: center;
            padding: 0.35rem 0.9rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 500;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            transition: all 0.25s ease;
            cursor: default;
            user-select: none;
        }
        .skill-tag:hover {
            border-color: var(--accent-purple);
            color: var(--text-primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(168, 85, 247, 0.25);
        }
        .cert-card { transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
        .cert-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: var(--shadow-card-hover), 0 0 30px rgba(0, 229, 255, 0.1);
            border-color: rgba(0, 229, 255, 0.35);
        }
        .danmaku-input {
            background: var(--bg-card);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            transition: all 0.3s ease;
            outline: none;
        }
        .danmaku-input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.25);
        }
        .danmaku-input::placeholder { color: var(--text-muted); }
        .btn-primary {
            background: var(--gradient-text);
            color: #fff;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(168, 85, 247, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(168, 85, 247, 0.5);
        }
        .btn-primary:active { transform: translateY(-1px); }
        /* 证书 / 实践图片展示卡片 */
        .cert-image-card {
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            overflow: hidden;
            border-radius: 0.75rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 0.5rem;
            position: relative;
        }
        .cert-image-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-card-hover), 0 0 20px rgba(0, 229, 255, 0.2);
            border-color: rgba(0, 229, 255, 0.4);
        }
        .cert-image-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 0.5rem;
            transition: transform 0.4s ease;
            background: rgba(0, 0, 0, 0.2);
        }
        .cert-image-card:hover img { transform: scale(1.03); }
        .cert-image-card .cert-label {
            position: absolute;
            bottom: 0.75rem;
            left: 0.75rem;
            right: 0.75rem;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #fff;
            font-size: 0.7rem;
            padding: 0.25rem 0.6rem;
            border-radius: 0.35rem;
            text-align: center;
            letter-spacing: 0.03em;
        }
        html:not(.dark) .cert-image-card .cert-label {
            background: rgba(255,255,255,0.85);
            color: #1a1a2e;
        }
        /* 头像样式 */
        .avatar-frame {
            position: relative;
            border-radius: 1.5rem;
            padding: 3px;
            background
